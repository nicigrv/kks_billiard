# Billard-System auf dem Raspberry Pi
#
# Starten (im Ordner ~/billard):   docker compose up -d --build
# Logs:                             docker logs -f billard
# Admin-Portal:                     http://<pi-ip>:8080
#
# Einmalige Werkzeuge (laufen nur auf Befehl):
#   docker compose stop coral && docker compose run --rm coral-check && docker compose start coral
#                                                       Coral-Stick testen
#   docker compose --profile sim up -d fake-table       simulierte Kamera (Test ohne Tisch)
#   docker compose --profile sim up -d fake-cue         simuliertes Queue-Gyroskop
#   docker compose run --rm updater                     Kamera-Firmware aktualisieren

services:
  billard:
    build: ./app
    image: billard-app:latest
    container_name: billard
    restart: unless-stopped
    # Host-Netzwerk: Portal direkt unter der IP des Pi, Pi-IP wird auf dem Beamer angezeigt
    network_mode: host
    environment:
      CAM_URL: http://192.168.88.200:81/stream    # <- IP der Kamera anpassen
      ADMIN_PIN: ""                                # <- z. B. "4711", leer = ohne PIN
      CUE_PORT: "5005"                             # UDP-Port fuer das Gyroskop im Queue
      CORAL_PORT: "8765"                           # Coral-Container (Dienst "coral")
    devices:
      - /dev/dri:/dev/dri                          # HDMI-Ausgabe
    volumes:
      - ./data:/data                               # Kalibrierung, Trainingsbilder, Videos
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  fake-cue:
    image: billard-app:latest
    profiles: ["sim"]
    network_mode: host
    command: ["python3", "-m", "sim.fake_cue"]

  # Fuehrt das trainierte Kugelmodell auf dem Coral-Stick aus (Python 3.9, Googles Pakete).
  # Ohne Modell oder ohne Stick nutzt das Hauptprogramm automatisch die klassische Erkennung.
  coral:
    build: ./coral
    image: billard-coral:latest
    container_name: billard-coral
    restart: unless-stopped
    network_mode: host                             # Hauptprogramm erreicht ihn auf 127.0.0.1:8765
    # Der Stick meldet sich nach dem Firmware-Laden mit neuer USB-ID neu an,
    # deshalb den ganzen USB-Bus durchreichen statt eines einzelnen Geraets.
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./data:/data:ro                            # Modell: data/models/billard_edgetpu.tflite
    device_cgroup_rules:
      - "c 189:* rmw"
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }

  # Hardware-Test. Vorher "docker compose stop coral", der Stick kann nur einen Benutzer haben.
  coral-check:
    image: billard-coral:latest
    profiles: ["tools"]
    command: ["python3", "check_coral.py"]
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"

  fake-table:
    image: billard-app:latest
    profiles: ["sim"]
    network_mode: host
    command: ["python3", "-m", "sim.fake_table"]

  updater:
    build: ./tools
    image: billard-updater:latest
    profiles: ["tools"]
    network_mode: host
    environment:
      CAM_HOST: 192.168.88.200                     # <- IP der Kamera
    volumes:
      - ./firmware:/firmware:ro
    stdin_open: true
    tty: true
