# Billard-System auf dem Raspberry Pi
#
# Starten (im Ordner ~/billard):   docker compose up -d --build
# Logs:                             docker logs -f billard
# Spiel-Panel (PIN unten):          http://<pi-ip>:8080            (Port: x-web-port unten)
# Admin-Panel (PIN unten):          http://<pi-ip>:8080/admin
# Beamerbild im Browser:            http://<pi-ip>:8080/beamer
#
# Einmalige Werkzeuge (laufen nur auf Befehl):
#   docker compose exec billard python3 coral_check.py   KI-Chip (Coral-Stick) testen
#   docker compose --profile sim up -d fake-cue         simulierter Queue (Castcode SMQ234)

# Port der Panels (und der Beamer-Ansicht /beamer). Nur hier aendern, z. B. "8090".
x-web-port: &web_port "8080"
# PIN fuer das Admin-Panel (/admin). Pruefer bekommen eigene Codes (im Admin-Panel unter "Pruefrunde").
x-admin-pin: &admin_pin "1902"
# PIN fuer das Spiel-Panel (Startseite): Spiel starten, Korrekturen, Schlagverbesserung, Queue an/aus.
x-game-pin: &game_pin "1212"

services:
  billard:
    build:
      context: ./app
      args:
        PI_CAMERA: "1"                             # Pi-Kameramodul-Software mitbauen (0 = weglassen)
        CORAL: "1"                                 # Treiber fuer den KI-Chip (Coral) mitbauen
    image: billard-app:latest
    container_name: billard
    restart: unless-stopped
    # Host-Netzwerk: Panels direkt unter der IP des Pi, Queue-Suche per UDP-Broadcast
    network_mode: host
    environment:
      ADMIN_PIN: *admin_pin                        # PINs: ganz oben bei x-admin-pin / x-game-pin einstellen
      GAME_PIN: *game_pin
      WEB_PORT: *web_port                          # Port: ganz oben bei x-web-port einstellen
      AUDIO_DEVICE: "hdmi:CARD=vc4hdmi0,DEV=0"     # Ding-Ton: HDMI 0 am Pi 4/5 (Liste: aplay -L)
      # Demo-Modus: Foto eines Pooltisches von oben (JPEG/PNG). Leer = simuliertes Spiel.
      # Gilt nur als Vorgabe, im Admin-Panel unter "Kamera" aenderbar.
      DEMO_IMAGE_URL: ""
      CUE_PORT: "5005"                             # UDP-Port, ueber den der Pi den Queue (Castcode) sucht
    # Zugriff auf HDMI-Ausgabe (/dev/dri), Pi-Kameramodul (/dev/media*, /dev/dma_heap) und
    # USB-Kamera (/dev/video*). Einfachste sichere Variante fuer ein Geraet im Heimnetz.
    privileged: true
    volumes:
      - ./data:/data                               # Einstellungen, Kalibrierung, Trainingsbilder, Videos
      - /run/udev:/run/udev:ro                     # Pi-Kameramodul (libcamera findet die Kamera)
      # KI-Chip: der Coral meldet sich nach dem ersten Laden mit neuer USB-Kennung neu an,
      # deshalb den ganzen USB-Bus durchreichen
      - /dev/bus/usb:/dev/bus/usb
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  fake-cue:
    image: billard-app:latest
    profiles: ["sim"]
    network_mode: host
    command: ["python3", "-m", "sim.fake_cue"]
    environment:
      WEB_PORT: *web_port
      ADMIN_PIN: *admin_pin
