# Gründliche Prüfung nach dem Merge (jeder Push auf main) oder von Hand unter Actions:
#   alle Python-Tests (Pi-Programm + Trainingsserver) und Firmware-Build aller Boards. Dauert einige Minuten.
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python:
    name: Python-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # wie im Container auf dem Pi (Debian bookworm)
          cache: pip
          cache-dependency-path: .github/workflows/test.yml
      - name: Pakete
        run: pip install -q numpy opencv-python-headless==4.10.0.84 pillow pygame
      - name: Tests Pi-Programm
        working-directory: app
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          for t in game features coral merkmale review cue_link panels; do
            echo "::group::sim.test_$t"
            python -m sim.test_$t
            echo "::endgroup::"
          done
      - name: Tests Trainingsserver
        working-directory: training_server
        run: python test_server.py

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('cue_sensor/platformio.ini', 'koe_messgeraet/platformio.ini') }}
      - run: pip install -q platformio
      - name: Queue (alle Boards)
        run: pio run -d cue_sensor
      - name: Kö-Messgerät
        run: pio run -d koe_messgeraet
