# Gründliche Prüfung nach dem Merge (jeder Push auf main) oder von Hand unter Actions:
#   alle Python-Tests (Pi-Programm + Trainingsserver) und Firmware-Build aller Boards. Dauert einige Minuten.
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  python:
    name: Python-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"          # wie im Container auf dem Pi (Debian bookworm)
          cache: pip
          cache-dependency-path: .github/workflows/test.yml
      - name: Pakete
        run: pip install -q numpy opencv-python-headless==4.10.0.84 pillow pygame
      - name: Tests Pi-Programm
        working-directory: app
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        # alle Tests laufen lassen (nicht beim ersten Fehler aufhoeren), am Ende die roten nennen
        run: |
          rot=""
          for t in game features coral merkmale review cue_link cue_update panels; do
            echo "::group::sim.test_$t"
            python -m "sim.test_$t" || rot="$rot sim.test_$t"
            echo "::endgroup::"
          done
          if [ -n "$rot" ]; then
            echo "::error::Fehlgeschlagen:$rot"
            exit 1
          fi
      - name: Tests Trainingsserver
        if: ${{ !cancelled() }}                # auch wenn das Pi-Programm rot ist
        working-directory: training_server
        run: python test_server.py

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('cue_sensor/platformio.ini') }}
      - run: pip install -q platformio
      - name: Queue (alle Boards)
        run: pio run -d cue_sensor
