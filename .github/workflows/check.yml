# Schnelle Formprüfung bei jedem Pull Request (ca. 30 Sekunden):
#   Syntax von Python, Shell-Skripten, docker-compose, JavaScript und Workflows.
# Blockiert das Mergen nicht. Tests und Firmware-Build laufen erst nach dem Merge (test.yml).
name: Formprüfung

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  form:
    name: Syntax und Form
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Python (ruff + compileall)
        run: |
          pip install -q --disable-pip-version-check ruff
          ruff check --select E9,F63,F7,F82 --output-format github app training_server training
          python3 -m compileall -q app training_server training
      - name: Shell-Skripte (shellcheck)
        run: shellcheck -S warning scripts/*.sh
      - name: docker-compose.yml (Pi und Server)
        run: |
          docker compose -f docker-compose.yml config -q
          export UPLOAD_KEY=test
          docker compose -f training_server/docker-compose.yml config -q
      - name: JavaScript (.js und in den HTML-Seiten)
        run: |
          git ls-files -z '*.js' | xargs -0 -n1 node --check
          git ls-files -z '*.html' | xargs -0 python3 scripts/check_html_js.py
      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
