<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Billard Trainingsmodus</title>
<style>
:root {
  --bg: #0B1712;
  --panel: #12241C;
  --line: #2A4436;
  --ink: #EFE6D2;
  --dim: #A9B3A6;
  --chalk: #6FB3E0;
  --ok: #7FE0A0;
  --bad: #FF8A80;
  --rail: #5A3520;
  --foul: #D2453B;
  --r: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: grid; grid-template-rows: auto 1fr; height: 100dvh; overflow: hidden;
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); gap: 8px; }

header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
header h1 { font-size: 20px; margin: 0; white-space: nowrap; }
.stats { color: var(--dim); font-size: 14px; flex: 1 1 260px; min-width: 0; }
.stats b { color: var(--ink); }
.stats .q { color: var(--ok); }
header .actions { display: flex; gap: 8px; }

button, a.btn { font: inherit; font-weight: 700; color: var(--ink); background: var(--rail); border: 0;
  border-radius: var(--r); min-height: 44px; padding: 8px 14px; cursor: pointer; touch-action: manipulation;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--chalk); color: #0A2F25; }
button.danger { background: var(--foul); }
button.quiet, a.btn.quiet { background: transparent; border: 2px solid var(--line); }
:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 10px; min-height: 0; }
.stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center;
  background: #000; border-radius: var(--r); overflow: hidden; }
#canvas { display: block; touch-action: manipulation; cursor: crosshair; }
.empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  text-align: center; padding: 24px; color: var(--dim); font-size: 18px; }
.empty.show { display: flex; }
.caption { position: absolute; left: 10px; top: 8px; background: rgba(0,0,0,.6); padding: 4px 10px;
  border-radius: 8px; font-size: 14px; color: var(--dim); pointer-events: none; }

aside { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.box h2 { font-size: 14px; margin: 0 0 8px; color: var(--dim); font-weight: 600; }
#zoom { width: 100%; max-width: 26vh; aspect-ratio: 1; display: block; margin: 0 auto; background: #000; border-radius: 8px; touch-action: manipulation; cursor: crosshair; }
.hint { color: var(--dim); font-size: 13px; margin: 6px 0 0; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip { min-height: 44px; padding: 4px; border-radius: 24px; font-size: 18px; border: 3px solid transparent; }
.chip.sel { border-color: var(--ink); }
.chip.wide { grid-column: span 4; font-size: 15px; border-radius: var(--r); }
.save { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.save .big { grid-column: span 3; min-height: 60px; font-size: 20px; }
.save button:not(.big) { padding: 8px 6px; font-size: 15px; }

.toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translate(-50%, 160%);
  transition: transform .2s; background: var(--ink); color: #0A2F25; font-weight: 700; padding: 10px 16px;
  border-radius: 10px; max-width: calc(100% - 32px); z-index: 5; }
.toast.show { transform: translate(-50%, 0); }
.toast.err { background: var(--foul); color: var(--ink); }
/* Anmeldung (Admin-PIN bzw. Pruefer-Code) */
.login { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  background: rgba(5, 12, 9, .92); padding: 16px; }
.login[hidden] { display: none; }
.login form { width: min(380px, 100%); display: grid; gap: 12px; text-align: center; }
.login h2 { margin: 0; font-size: 24px; color: var(--ink); }
.login input { font: 700 32px/1 system-ui, sans-serif; letter-spacing: 8px; text-align: center; padding: 14px;
  border-radius: var(--r); border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.login button { min-height: 56px; font-size: 20px; }
#who { color: var(--chalk); font-weight: 700; white-space: nowrap; }
/* Pruefrunde: Stand der anderen ueber dem Bild */
.banner { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 20px);
  background: rgba(10, 20, 15, .9); border: 2px solid var(--line); border-radius: var(--r); padding: 8px 14px;
  font-size: 15px; text-align: center; pointer-events: none; }
.banner[hidden] { display: none; }
.banner .d { color: var(--ok); font-weight: 700; }
.banner .w { color: var(--dim); }

/* Hochformat / Handy: Bild oben, Bedienung darunter */
@media (max-width: 820px), (orientation: portrait) {
  body { overflow: auto; height: auto; min-height: 100dvh; }
  main { grid-template-columns: 1fr; }
  .stage { min-height: 45vh; }
  #zoom { max-width: 220px; margin: 0 auto; }
  .chips { grid-template-columns: repeat(8, 1fr); }
  .chip.wide { grid-column: span 8; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Trainingsmodus</h1>
  <span id="who"></span>
  <div class="stats" id="stats" aria-live="polite">-</div>
  <div class="actions">
    <button class="primary" type="button" id="roundBtn" data-admin>An alle Prüfer</button>
    <button class="quiet" type="button" id="captureBtn" data-admin>Bild aufnehmen</button>
    <button class="danger" type="button" id="deleteAllBtn" data-admin>Alle löschen</button>
    <a class="btn quiet" href="/" id="portalLink" data-admin>Portal</a>
    <button class="quiet" type="button" id="logoutBtn">Abmelden</button>
  </div>
</header>
<div class="login" id="login" hidden>
  <form id="loginForm" class="box" autocomplete="off">
    <h2 id="loginTitle">Anmelden</h2>
    <input type="password" id="loginInput" inputmode="numeric" maxlength="12" aria-label="PIN oder Code">
    <button class="primary" type="submit">Anmelden</button>
    <p class="hint" id="loginHint"></p>
  </form>
</div>

<main>
  <div class="stage" id="stage">
    <canvas id="canvas" width="800" height="400" aria-label="Tischbild: Kugel antippen oder freie Stelle antippen, um eine Kugel hinzuzufügen"></canvas>
    <div class="caption" id="caption" hidden></div>
    <div class="empty" id="empty">Keine Bilder offen.<br>Oben „Bild aufnehmen“ drücken.</div>
    <div class="banner" id="banner" aria-live="polite" hidden></div>
  </div>

  <aside>
    <div class="box">
      <h2 id="zoomTitle">Lupe</h2>
      <canvas id="zoom" width="240" height="240" aria-label="Vergrößerung der gewählten Kugel: antippen, um die Mitte genau zu setzen"></canvas>
      <p class="hint" id="zoomHint">Kugel im Bild antippen. In der Lupe tippen setzt die Mitte genau.</p>
    </div>
    <div class="box">
      <h2 id="pickTitle">Nummer der gewählten Kugel</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="box save">
      <button class="primary big" type="button" id="saveBtn" disabled>Passt alles</button>
      <button class="quiet" type="button" id="undoBtn" disabled>Rückgängig</button>
      <button class="quiet" type="button" id="skipBtn" disabled data-admin>Später</button>
      <button class="danger" type="button" id="discardBtn" disabled data-admin>Verwerfen</button>
    </div>
  </aside>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas"), ctx = canvas.getContext("2d");
  const zoom = $("zoom"), zctx = zoom.getContext("2d");
  const img = new Image();
  const COLORS = [["gelb", "#F5C314", 1], ["blau", "#2355CD", 2], ["rot", "#D72D28", 3], ["violett", "#7837A0", 4],
                  ["orange", "#F57D19", 5], ["gruen", "#198C41", 6], ["weinrot", "#871E2D", 7]];
  const ZOOM = 4;                      // Vergroesserung der Lupe
  // /training = Admin (PIN), /pruefen = Pruefer (eigener Code, Pruefrunden)
  const PRUEFER = location.pathname.startsWith("/pruefen");
  let me = { role: null, name: null };
  let round = null;              // aktuelle Pruefrunde (nur Pruefer)
  let item = null, selected = -1, history = [];

  function toast(text, err) {
    const t = $("toast");
    t.textContent = text;
    t.className = "toast show" + (err ? " err" : "");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.className = "toast"; }, 2600);
  }

  async function post(name, payload) {
    try {
      const r = await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload || {}) });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401 || r.status === 403) { showLogin(data.error); return null; }
      if (!r.ok) { toast(data.error || "Fehler", true); return null; }
      if (data.message) toast(data.message);
      if (data.state) renderStats(data.state);
      return data;
    } catch (e) { toast("Tisch nicht erreichbar", true); return null; }
  }

  // ---------------- Anmeldung ----------------
  function showLogin(msg) {
    $("loginTitle").textContent = PRUEFER ? "Prüfer: deinen Code eingeben" : "Admin-PIN eingeben";
    $("loginHint").textContent = msg && msg !== "Bitte anmelden" ? msg :
      (PRUEFER ? "Den 4-stelligen Code bekommst du vom Admin." : "");
    $("login").hidden = false;
    $("loginInput").value = "";
    setTimeout(() => $("loginInput").focus(), 50);
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ secret: $("loginInput").value.trim() }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { showLogin(data.error || "Anmeldung fehlgeschlagen"); return; }
      if (PRUEFER && data.role !== "pruefer") { showLogin("Das ist der Admin-PIN - Admins nehmen /training"); return; }
      if (!PRUEFER && data.role !== "admin") { showLogin("Das ist ein Prüfer-Code - Prüfer nehmen /pruefen"); return; }
      $("login").hidden = true;
      me = { role: data.role, name: data.name, pin_required: true };
      start();
    } catch (err) { showLogin("Tisch nicht erreichbar"); }
  });
  $("logoutBtn").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" }).catch(() => {});
    location.reload();
  });

  // ---------------- Kugeln ----------------
  function numberOf(b) {
    if (b.kind === "cue") return 0;
    if (b.kind === "eight") return 8;
    const c = COLORS.find((x) => x[0] === b.color);
    if (!c || (b.kind !== "solid" && b.kind !== "stripe")) return null;
    return b.kind === "solid" ? c[2] : c[2] + 8;
  }
  function setNumber(b, n) {
    if (n === 0) { b.kind = "cue"; b.color = ""; }
    else if (n === 8) { b.kind = "eight"; b.color = "schwarz"; }
    else { const c = COLORS.find((x) => x[2] === (n < 8 ? n : n - 8)); b.kind = n < 8 ? "solid" : "stripe"; b.color = c[0]; }
    b.changed = true;
  }
  function missing() { return item ? item.balls.filter((b) => numberOf(b) === null).length : 0; }
  function snapshot() { if (item) { history.push(JSON.stringify(item.balls)); if (history.length > 50) history.shift(); } }

  // ---------------- Zeichnen ----------------
  function ballStyle(b) {
    const n = numberOf(b);
    if (n === null) return { stroke: "#FF8A80", label: "?" };
    if (n === 0) return { stroke: "#FFFFFF", label: "W" };
    if (n === 8) return { stroke: "#BDBDBD", label: "8" };
    return { stroke: COLORS[(n < 8 ? n : n - 8) - 1][1], label: String(n) };
  }
  // Bild so gross wie moeglich (Seitenverhaeltnis bleibt), scharf auf Retina-Displays.
  // Gezeichnet wird in Bild-Koordinaten (wie die Kugelpositionen), view.k rechnet um.
  const view = { w: 800, h: 400, k: 1 };
  function fit() {
    const st = $("stage").getBoundingClientRect();
    const k = Math.max(0.1, Math.min(st.width / view.w, st.height / view.h));
    const dpr = window.devicePixelRatio || 1;
    view.k = k;
    canvas.style.width = Math.floor(view.w * k) + "px";
    canvas.style.height = Math.floor(view.h * k) + "px";
    canvas.width = Math.floor(view.w * k * dpr);
    canvas.height = Math.floor(view.h * k * dpr);
    ctx.setTransform(k * dpr, 0, 0, k * dpr, 0, 0);
    draw();
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 200));

  function draw() {
    ctx.clearRect(0, 0, view.w, view.h);
    if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, view.w, view.h);
    if (!item) return;
    const r = item.radius;
    const fs = Math.max(14, Math.round(r * 1.3));
    item.balls.forEach((b, i) => {
      const st = ballStyle(b);
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(0,0,0,.8)";
      ctx.beginPath(); ctx.arc(b.x, b.y, r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = st.stroke;
      ctx.beginPath(); ctx.arc(b.x, b.y, r + 4, 0, Math.PI * 2); ctx.stroke();
      if (i === selected) {
        ctx.lineWidth = 3; ctx.strokeStyle = "#6FB3E0";
        ctx.beginPath(); ctx.arc(b.x, b.y, r + 10, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.font = "bold " + fs + "px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const w = Math.max(fs + 6, ctx.measureText(st.label).width + 8);
      ctx.fillStyle = "rgba(0,0,0,.75)";
      ctx.fillRect(b.x + r + 2, b.y - r - fs - 2, w, fs + 4);
      ctx.fillStyle = st.label === "?" ? "#FF8A80" : b.changed ? "#7FE0A0" : "#FFFFFF";
      ctx.fillText(st.label, b.x + r + 2 + w / 2, b.y - r - fs / 2);
    });
    drawZoom();
  }
  function drawZoom() {
    zctx.fillStyle = "#000"; zctx.fillRect(0, 0, zoom.width, zoom.height);
    const b = item && selected >= 0 ? item.balls[selected] : null;
    if (!b || !img.naturalWidth) { $("zoomTitle").textContent = "Lupe"; return; }
    const half = zoom.width / ZOOM / 2;
    const sx = img.naturalWidth / view.w, sy = img.naturalHeight / view.h;
    zctx.imageSmoothingEnabled = false;
    zctx.drawImage(img, (b.x - half) * sx, (b.y - half) * sy, 2 * half * sx, 2 * half * sy, 0, 0, zoom.width, zoom.height);
    const c = zoom.width / 2, r = item.radius * ZOOM;
    zctx.strokeStyle = "#6FB3E0"; zctx.lineWidth = 2;
    zctx.beginPath(); zctx.arc(c, c, r, 0, Math.PI * 2); zctx.stroke();
    zctx.beginPath(); zctx.moveTo(c - 8, c); zctx.lineTo(c + 8, c); zctx.moveTo(c, c - 8); zctx.lineTo(c, c + 8); zctx.stroke();
    const n = numberOf(b);
    $("zoomTitle").textContent = "Lupe – " + (n === null ? "Nummer fehlt" : n === 0 ? "Weiße" : "Kugel " + n);
  }

  function renderChips() {
    const box = $("chips");
    box.innerHTML = "";
    const b = item && selected >= 0 ? item.balls[selected] : null;
    const cur = b ? numberOf(b) : undefined;
    const add = (label, n, style, cls) => {
      const bt = document.createElement("button");
      bt.type = "button";
      bt.className = "chip" + (cls ? " " + cls : "") + (b && cur === n ? " sel" : "");
      bt.textContent = label;
      bt.disabled = !b;
      Object.assign(bt.style, style || {});
      bt.setAttribute("aria-label", n === null ? "Keine Kugel" : n === 0 ? "Weiße" : "Kugel " + n);
      bt.addEventListener("click", () => {
        if (!b) return;
        snapshot();
        if (n === null) item.balls.splice(selected, 1);
        else setNumber(b, n);
        selected = -1;
        update();
      });
      box.appendChild(bt);
    };
    add("W", 0, { background: "#F4F1E8", color: "#111" });
    for (const [, hex, num] of COLORS) add(String(num), num, { background: hex, color: "#fff" });
    add("8", 8, { background: "#111", color: "#fff" });
    for (const [, hex, num] of COLORS) add(String(num + 8), num + 8,
      { background: "linear-gradient(#EFE6D2 28%, " + hex + " 28% 72%, #EFE6D2 72%)", color: "#111" });
    add("Keine Kugel (entfernen)", null, {}, "wide");
    $("pickTitle").textContent = b ? "Welche Kugel ist das?" : "Erst eine Kugel im Bild antippen";
  }

  function update() {
    const m = missing();
    const changed = !!item && item.balls.some((b) => b.changed);
    $("saveBtn").disabled = !item || m > 0;
    $("saveBtn").textContent = !item ? "Passt alles" : m ? m + " Nummer(n) fehlen" :
      PRUEFER ? (round && round.submitted ? "Nochmal speichern" : "Speichern") :
      !item.balls.length ? "Ohne Kugeln speichern" : changed ? "Speichern & weiter" : "Passt alles";
    $("skipBtn").disabled = !item;
    $("discardBtn").disabled = !item;
    $("undoBtn").disabled = !history.length;
    draw();
    renderChips();
  }

  // ---------------- Laden / Speichern ----------------
  async function load(after) {
    item = null; selected = -1; history = [];
    update();
    try {
      const r = await fetch("/api/review/next" + (after ? "?after=" + encodeURIComponent(after) : ""), { cache: "no-store" });
      if (r.status === 404) {
        $("empty").classList.add("show"); $("caption").hidden = true;
        ctx.clearRect(0, 0, view.w, view.h);
        return;
      }
      const data = await r.json();
      if (!r.ok) { toast(data.error || "Kein Bild", true); return; }
      $("empty").classList.remove("show");
      item = data;
      view.w = data.width; view.h = data.height;
      fit();
      const t = data.name.slice(9, 11) + ":" + data.name.slice(11, 13);
      $("caption").textContent = "Bild von " + t + " Uhr · noch " + data.pending + " offen" +
        (data.model ? " · Vorschlag vom KI-Chip" : " · ohne Vorschlag");
      $("caption").hidden = false;
      img.src = "/api/review/image?name=" + encodeURIComponent(data.name);
      update();
    } catch (e) { toast("Tisch nicht erreichbar", true); }
  }
  img.onload = draw;

  $("saveBtn").addEventListener("click", async () => {
    if (!item) return;
    if (!item.balls.length && !confirm("Liegen auf diesem Bild wirklich KEINE Kugeln?")) return;
    if (PRUEFER) {
      const res = await post("round/submit", { id: item.name, balls: item.balls });
      if (res) showRound(res);
      return;
    }
    if (await post("review_save", { name: item.name, balls: item.balls })) load();
  });
  $("roundBtn").addEventListener("click", async () => {
    await post("round_start", {});
  });
  $("discardBtn").addEventListener("click", async () => {
    if (item && await post("review_save", { name: item.name, discard: true })) load();
  });
  $("skipBtn").addEventListener("click", () => { if (item) load(item.name); });
  $("undoBtn").addEventListener("click", () => {
    if (!history.length || !item) return;
    item.balls = JSON.parse(history.pop());
    selected = -1;
    update();
  });
  let counts = 0;
  $("deleteAllBtn").addEventListener("click", async () => {
    if (!counts) { toast("Es gibt keine Bilder zum Löschen"); return; }
    if (!confirm("ALLE " + counts + " Trainingsbilder löschen (offene, festgelegte und verworfene)?\n\nDas kann nicht rückgängig gemacht werden. Das KI-Modell bleibt erhalten.")) return;
    if (await post("delete_images", { confirm: true })) load();
  });
  $("captureBtn").addEventListener("click", async () => {
    if (await post("capture", {}) && !item) load();
  });

  // ---------------- Antippen ----------------
  function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * view.w / r.width, (e.clientY - r.top) * view.h / r.height];
  }
  canvas.addEventListener("click", (e) => {
    if (!item) return;
    const [x, y] = canvasPoint(e);
    let best = -1, bd = Infinity;
    item.balls.forEach((b, i) => { const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = i; } });
    if (best >= 0 && bd <= item.radius * 1.6) {
      selected = best === selected ? -1 : best;
    } else {
      snapshot();
      item.balls.push({ x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, kind: "solid", color: "", changed: true });
      selected = item.balls.length - 1;
    }
    update();
  });
  zoom.addEventListener("click", (e) => {
    if (!item || selected < 0) return;
    const r = zoom.getBoundingClientRect();
    const dx = ((e.clientX - r.left) * zoom.width / r.width - zoom.width / 2) / ZOOM;
    const dy = ((e.clientY - r.top) * zoom.height / r.height - zoom.height / 2) / ZOOM;
    snapshot();
    const b = item.balls[selected];
    b.x = Math.round((b.x + dx) * 10) / 10;
    b.y = Math.round((b.y + dy) * 10) / 10;
    b.changed = true;
    update();
  });

  // Tastatur (iPad mit Tastatur): Enter = speichern, Entf = Kugel entfernen, Esc = abwaehlen
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "Enter" && !$("saveBtn").disabled) $("saveBtn").click();
    else if (e.key === "Escape") { selected = -1; update(); }
    else if ((e.key === "Delete" || e.key === "Backspace") && item && selected >= 0) {
      snapshot(); item.balls.splice(selected, 1); selected = -1; update();
    }
  });

  // ---------------- Zaehler ----------------
  function renderStats(s) {
    const t = s.training || {};
    counts = (t.pending || 0) + (t.verified || 0) + (t.discarded || 0);
    const el = $("stats");
    el.innerHTML = "";
    const add = (txt, val, cls) => {
      if (el.childNodes.length) el.appendChild(document.createTextNode("  ·  "));
      const b = document.createElement("b"); b.textContent = val; if (cls) b.className = cls;
      el.appendChild(b); el.appendChild(document.createTextNode(" " + txt));
    };
    add("offen", t.pending || 0);
    add("festgelegt", t.verified || 0);
    if (t.quality) add("richtig (KI-Chip)", t.quality.percent + " %", "q");
    if (t.disk_ok === false) add("", "Speicher fast voll!");
    const rv = s.review || {};
    const online = (s.reviewers || []).filter((r) => r.online).length;
    if (rv.active) add("fertig (Prüfrunde Bild " + rv.no + ")", rv.done + "/" + rv.total);
    else add("Prüfer online", online);
    $("roundBtn").disabled = !!rv.active || !online;
  }

  // ---------------- Pruefer-Modus ----------------
  function showRound(data) {
    const r = data.round;
    const banner = $("banner");
    if (!r) {
      round = null;
      if (item) { item = null; selected = -1; history = []; update(); }
      ctx.clearRect(0, 0, view.w, view.h);
      $("caption").hidden = true;
      const last = data.last;
      $("empty").innerHTML = "";
      const p1 = document.createElement("div");
      p1.textContent = "Warte auf das nächste Bild vom Admin …";
      $("empty").appendChild(p1);
      if (last && last.text) {
        const p2 = document.createElement("div");
        p2.style.marginTop = "12px"; p2.style.fontSize = "15px";
        p2.textContent = "Zuletzt: " + last.text;
        $("empty").appendChild(p2);
      }
      $("empty").classList.add("show");
      banner.hidden = true;
      return;
    }
    $("empty").classList.remove("show");
    if (!round || round.id !== r.id) {
      // neues Bild: Vorschlag (bzw. eigenes Ergebnis) laden
      item = { name: r.id, width: r.width, height: r.height, radius: r.radius,
               balls: JSON.parse(JSON.stringify(r.balls || [])) };
      selected = -1; history = [];
      view.w = r.width; view.h = r.height;
      fit();
      img.src = "/api/round/image?id=" + encodeURIComponent(r.id);
      $("caption").textContent = "Prüfrunde · Bild " + r.no + (r.model ? " · Vorschlag vom KI-Chip" : " · ohne Vorschlag");
      $("caption").hidden = false;
    }
    round = r;
    banner.innerHTML = "";
    const head = document.createElement("div");
    head.textContent = r.submitted ? "Gespeichert ✓ – warte auf die anderen" : "Kugeln festlegen, dann „Speichern“";
    banner.appendChild(head);
    const line = document.createElement("div");
    r.status.forEach((p, i) => {
      if (i) line.appendChild(document.createTextNode("   "));
      const sp = document.createElement("span");
      sp.className = p.done ? "d" : "w";
      sp.textContent = (p.done ? "✓ " : "… ") + p.name;
      line.appendChild(sp);
    });
    banner.appendChild(line);
    banner.hidden = false;
    update();
  }

  async function pollRound() {
    try {
      const r = await fetch("/api/round", { cache: "no-store" });
      if (r.status === 401 || r.status === 403) { showLogin(); return; }
      if (r.ok) showRound(await r.json());
    } catch (e) { /* naechster Versuch */ }
    setTimeout(pollRound, 1500);
  }
  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (r.status === 401 || r.status === 403) { showLogin(); return; }
      if (r.ok) {
        const s = await r.json();
        renderStats(s);
        if (!item && (s.training || {}).pending) load();
      }
    } catch (e) { /* naechster Versuch */ }
    setTimeout(poll, 4000);
  }

  let started = false;
  function start() {
    if (started) return;
    started = true;
    if (PRUEFER) {
      document.querySelectorAll("[data-admin]").forEach((el) => { el.hidden = true; });
      $("title").textContent = "Prüfen";
      $("who").textContent = me.name || "";
      $("stats").textContent = "";
      pollRound();
    } else {
      $("logoutBtn").hidden = !me.pin_required;
      load();
      poll();
    }
  }

  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) { /* egal */ }
  fit();
  update();
  fetch("/api/me", { cache: "no-store" }).then((r) => r.json()).then((d) => {
    me = d;
    const ok = PRUEFER ? d.role === "pruefer" : d.role === "admin";
    if (ok) start(); else showLogin();
  }).catch(() => showLogin("Tisch nicht erreichbar"));
})();
</script>
</body>
</html>
