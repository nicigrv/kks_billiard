<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Billard-Training">
<meta name="robots" content="noindex, nofollow">
<title>Billard-Training</title>
<style>
:root {
  --bg: #0B1712;
  --panel: #12241C;
  --line: #2A4436;
  --ink: #EFE6D2;
  --dim: #A9B3A6;
  --chalk: #6FB3E0;
  --ok: #7FE0A0;
  --gold: #FFD180;
  --bad: #FF8A80;
  --rail: #5A3520;
  --foul: #D2453B;
  --r: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: grid; grid-template-rows: auto 1fr; height: 100dvh; overflow: hidden;
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); gap: 8px; }

header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
header h1 { font-size: 20px; margin: 0; white-space: nowrap; }
.stats { color: var(--dim); font-size: 14px; flex: 1 1 260px; min-width: 0; }
.stats b { color: var(--ink); }
.stats .q { color: var(--ok); }
#who { color: var(--chalk); font-weight: 700; white-space: nowrap; }

button, a.btn { font: inherit; font-weight: 700; color: var(--ink); background: var(--rail); border: 0;
  border-radius: var(--r); min-height: 44px; padding: 8px 14px; cursor: pointer; touch-action: manipulation;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--chalk); color: #0A2F25; }
button.ok { background: var(--ok); color: #0A2F25; }
button.danger { background: var(--foul); }
button.quiet { background: transparent; border: 2px solid var(--line); }
:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 10px; min-height: 0; }
.stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center;
  background: #000; border-radius: var(--r); overflow: hidden; }
#canvas { display: block; touch-action: manipulation; cursor: crosshair; }
.empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  text-align: center; padding: 24px; color: var(--dim); font-size: 18px; }
.empty.show { display: flex; flex-direction: column; gap: 8px; }
.caption { position: absolute; left: 10px; top: 8px; right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  pointer-events: none; }
.caption span { background: rgba(0,0,0,.65); padding: 4px 10px; border-radius: 8px; font-size: 14px; color: var(--dim); }
.caption .runde { color: #0A2F25; font-weight: 800; }
.caption .runde.r1 { background: var(--chalk); }
.caption .runde.r2 { background: var(--gold); }

aside { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.box h2 { font-size: 14px; margin: 0 0 8px; color: var(--dim); font-weight: 600; }
.auftrag { font-size: 15px; }
.auftrag b { color: var(--ink); }
.auftrag.r2 { border-color: #7a6a3d; }
#zoom { width: 100%; max-width: 26vh; aspect-ratio: 1; display: block; margin: 0 auto; background: #000; border-radius: 8px; touch-action: manipulation; cursor: crosshair; }
.hint { color: var(--dim); font-size: 13px; margin: 6px 0 0; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip { min-height: 44px; padding: 4px; border-radius: 24px; font-size: 18px; border: 3px solid transparent; }
.chip.sel { border-color: var(--ink); }
.chip.wide { grid-column: span 4; font-size: 15px; border-radius: var(--r); }
.save { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.save .big { grid-column: span 3; min-height: 60px; font-size: 20px; }
.save button:not(.big) { padding: 8px 6px; font-size: 15px; }

.login { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  background: rgba(5, 12, 9, .94); padding: 16px; }
.login form { width: min(400px, 100%); display: grid; gap: 12px; text-align: center; }
.login h2 { margin: 0; font-size: 24px; color: var(--ink); }
.login p { margin: 0; color: var(--dim); }
.login input { font: 700 34px/1 system-ui, sans-serif; letter-spacing: 10px; text-align: center; padding: 14px;
  border-radius: var(--r); border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.login button { min-height: 56px; font-size: 20px; }
.login .fehler { color: var(--bad); font-weight: 600; min-height: 1.3em; }

/* Meldungen unten links ueber dem Bild - oben rechts lagen sie ueber den Nummern 1-7 und schluckten die Klicks */
.ntf-stack { top: auto !important; right: auto !important; left: max(14px, env(safe-area-inset-left)) !important;
  bottom: max(14px, env(safe-area-inset-bottom)) !important; width: min(360px, calc(100vw - 28px)) !important; }
.ntf, .ntf-pill { pointer-events: none !important; }

@media (max-width: 820px), (orientation: portrait) {
  body { overflow: auto; height: auto; min-height: 100dvh; }
  main { grid-template-columns: 1fr; }
  .stage { min-height: 45vh; }
  #zoom { max-width: 220px; margin: 0 auto; }
  .chips { grid-template-columns: repeat(8, 1fr); }
  .chip.wide { grid-column: span 8; }
}
</style>
</head>
<body>
<header>
  <h1>🎱 Billard-Training</h1>
  <span id="who"></span>
  <div class="stats" id="stats" aria-live="polite"></div>
  <button class="quiet" type="button" id="logoutBtn" hidden>Abmelden</button>
</header>
<div class="login" id="login" hidden>
  <form id="loginForm" class="box" autocomplete="off">
    <h2>Anmelden</h2>
    <p>Gib deinen 6-stelligen Code ein.</p>
    <input type="password" id="loginInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Dein Code">
    <button class="primary" type="submit">Los geht’s</button>
    <p class="fehler" id="loginHint" role="alert"></p>
  </form>
</div>

<main>
  <div class="stage" id="stage">
    <canvas id="canvas" width="800" height="400" aria-label="Tischbild: Kugel antippen, freie Stelle antippen fügt eine Kugel hinzu"></canvas>
    <div class="caption" id="caption" hidden></div>
    <div class="empty" id="empty"></div>
  </div>

  <aside>
    <div class="box auftrag" id="auftrag">Kugel im Bild antippen, dann ihre Nummer wählen.</div>
    <div class="box save">
      <button class="primary big" type="button" id="saveBtn" disabled>Passt alles</button>
      <button class="quiet" type="button" id="undoBtn" disabled>Rückgängig</button>
      <button class="quiet" type="button" id="skipBtn" disabled>Später</button>
      <button class="danger" type="button" id="discardBtn" disabled>Unbrauchbar</button>
    </div>
    <div class="box">
      <h2 id="pickTitle">Nummer der gewählten Kugel</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="box">
      <h2 id="zoomTitle">Lupe</h2>
      <canvas id="zoom" width="240" height="240" aria-label="Vergrößerung der gewählten Kugel: antippen setzt die Mitte genau"></canvas>
      <p class="hint">In der Lupe tippen setzt die Mitte genau. Freie Stelle im Bild antippen = Kugel hinzufügen.</p>
    </div>
  </aside>
</main>
<script src="/notify.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas"), ctx = canvas.getContext("2d");
  const zoom = $("zoom"), zctx = zoom.getContext("2d");
  const img = new Image();
  const COLORS = [["gelb", "#F5C314", 1], ["blau", "#2355CD", 2], ["rot", "#D72D28", 3], ["violett", "#7837A0", 4],
                  ["orange", "#F57D19", 5], ["gruen", "#198C41", 6], ["weinrot", "#871E2D", 7]];
  const ZOOM = 4;
  let item = null, selected = -1, history = [], loading = false, me = null, stand = null, heute = 0;

  function toast(text, err) { Notify.show(text, "", err ? "error" : "success"); }

  async function post(name, payload) {
    try {
      const r = await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload || {}) });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { showLogin(); return null; }
      if (!r.ok) { toast(data.error || "Fehler", true); return r.status === 409 ? { conflict: true } : null; }
      if (data.message) toast(data.message);
      if (data.stand) renderStats(data.stand);
      return data;
    } catch (e) { toast("Keine Verbindung", true); return null; }
  }

  // ---------------- Anmeldung ----------------
  function showLogin(msg) {
    $("loginHint").textContent = msg || "";
    $("login").hidden = false;
    $("loginInput").value = "";
    setTimeout(() => $("loginInput").focus(), 50);
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: $("loginInput").value.trim() }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { showLogin(data.error || "Anmeldung fehlgeschlagen"); return; }
      $("login").hidden = true;
      start(data.name);
    } catch (err) { showLogin("Keine Verbindung"); }
  });
  $("logoutBtn").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" }).catch(() => {});
    location.reload();
  });

  // ---------------- Kugeln ----------------
  function numberOf(b) {
    if (b.kind === "cue") return 0;
    if (b.kind === "eight") return 8;
    const c = COLORS.find((x) => x[0] === b.color);
    if (!c || (b.kind !== "solid" && b.kind !== "stripe")) return null;
    return b.kind === "solid" ? c[2] : c[2] + 8;
  }
  function setNumber(b, n) {
    if (n === 0) { b.kind = "cue"; b.color = ""; }
    else if (n === 8) { b.kind = "eight"; b.color = "schwarz"; }
    else { const c = COLORS.find((x) => x[2] === (n < 8 ? n : n - 8)); b.kind = n < 8 ? "solid" : "stripe"; b.color = c[0]; }
    b.changed = true;
  }
  function missing() { return item ? item.balls.filter((b) => numberOf(b) === null).length : 0; }
  // Jede Nummer gibt es nur einmal (W, 1-15) - doppelte Nummern muessen geprueft werden
  function doubles() {
    const seen = {}, out = new Set();
    (item ? item.balls : []).forEach((b) => { const n = numberOf(b); if (n === null) return; if (n in seen) out.add(n); seen[n] = true; });
    return [...out].sort((a, b) => a - b);
  }
  const nrText = (n) => n === 0 ? "W (Weiße)" : String(n);
  function snapshot() { if (item) { history.push(JSON.stringify(item.balls)); if (history.length > 50) history.shift(); } }

  // ---------------- Zeichnen ----------------
  function ballStyle(b) {
    const n = numberOf(b);
    if (n === null) return { stroke: "#FF8A80", label: "?" };
    if (n === 0) return { stroke: "#FFFFFF", label: "W" };
    if (n === 8) return { stroke: "#BDBDBD", label: "8" };
    return { stroke: COLORS[(n < 8 ? n : n - 8) - 1][1], label: String(n) };
  }
  const view = { w: 800, h: 400, k: 1 };
  function fit() {
    const st = $("stage").getBoundingClientRect();
    const k = Math.max(0.1, Math.min(st.width / view.w, st.height / view.h));
    const dpr = window.devicePixelRatio || 1;
    view.k = k;
    canvas.style.width = Math.floor(view.w * k) + "px";
    canvas.style.height = Math.floor(view.h * k) + "px";
    canvas.width = Math.floor(view.w * k * dpr);
    canvas.height = Math.floor(view.h * k * dpr);
    ctx.setTransform(k * dpr, 0, 0, k * dpr, 0, 0);
    draw();
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 200));

  function draw() {
    ctx.clearRect(0, 0, view.w, view.h);
    if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, view.w, view.h);
    if (!item) return;
    const r = item.radius;
    const fs = Math.max(14, Math.round(r * 1.3));
    const dup = new Set(doubles());
    item.balls.forEach((b, i) => {
      const st = ballStyle(b);
      if (dup.has(numberOf(b))) {
        ctx.lineWidth = 4; ctx.strokeStyle = "#FF5252"; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.arc(b.x, b.y, r + 14, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.8)";
      ctx.beginPath(); ctx.arc(b.x, b.y, r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = st.stroke;
      ctx.beginPath(); ctx.arc(b.x, b.y, r + 4, 0, Math.PI * 2); ctx.stroke();
      if (i === selected) {
        ctx.lineWidth = 3; ctx.strokeStyle = "#6FB3E0";
        ctx.beginPath(); ctx.arc(b.x, b.y, r + 10, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.font = "bold " + fs + "px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const w = Math.max(fs + 6, ctx.measureText(st.label).width + 8);
      ctx.fillStyle = "rgba(0,0,0,.75)";
      ctx.fillRect(b.x + r + 2, b.y - r - fs - 2, w, fs + 4);
      ctx.fillStyle = st.label === "?" ? "#FF8A80" : b.changed ? "#7FE0A0" : "#FFFFFF";
      ctx.fillText(st.label, b.x + r + 2 + w / 2, b.y - r - fs / 2);
    });
    drawZoom();
  }
  function drawZoom() {
    zctx.fillStyle = "#000"; zctx.fillRect(0, 0, zoom.width, zoom.height);
    const b = item && selected >= 0 ? item.balls[selected] : null;
    if (!b || !img.naturalWidth) { $("zoomTitle").textContent = "Lupe"; return; }
    const half = zoom.width / ZOOM / 2;
    const sx = img.naturalWidth / view.w, sy = img.naturalHeight / view.h;
    zctx.imageSmoothingEnabled = false;
    zctx.drawImage(img, (b.x - half) * sx, (b.y - half) * sy, 2 * half * sx, 2 * half * sy, 0, 0, zoom.width, zoom.height);
    const c = zoom.width / 2, r = item.radius * ZOOM;
    zctx.strokeStyle = "#6FB3E0"; zctx.lineWidth = 2;
    zctx.beginPath(); zctx.arc(c, c, r, 0, Math.PI * 2); zctx.stroke();
    zctx.beginPath(); zctx.moveTo(c - 8, c); zctx.lineTo(c + 8, c); zctx.moveTo(c, c - 8); zctx.lineTo(c, c + 8); zctx.stroke();
    const n = numberOf(b);
    $("zoomTitle").textContent = "Lupe – " + (n === null ? "Nummer fehlt" : n === 0 ? "Weiße" : "Kugel " + n);
  }

  function renderChips() {
    const box = $("chips");
    box.innerHTML = "";
    const b = item && selected >= 0 ? item.balls[selected] : null;
    const cur = b ? numberOf(b) : undefined;
    const add = (label, n, style, cls) => {
      const bt = document.createElement("button");
      bt.type = "button";
      bt.className = "chip" + (cls ? " " + cls : "") + (b && cur === n ? " sel" : "");
      bt.textContent = label;
      bt.disabled = !b;
      Object.assign(bt.style, style || {});
      bt.setAttribute("aria-label", n === null ? "Keine Kugel" : n === 0 ? "Weiße" : "Kugel " + n);
      bt.addEventListener("click", () => {
        if (!b) return;
        snapshot();
        if (n === null) item.balls.splice(selected, 1);
        else setNumber(b, n);
        selected = -1;
        update();
        if (n !== null && doubles().includes(n))
          Notify.show("Nummer " + nrText(n) + " ist jetzt zweimal vergeben", "Bitte nochmal prüfen – rot gestrichelt markiert.", "warning");
      });
      box.appendChild(bt);
    };
    add("W", 0, { background: "#F4F1E8", color: "#111" });
    for (const [, hex, num] of COLORS) add(String(num), num, { background: hex, color: "#fff" });
    add("8", 8, { background: "#111", color: "#fff" });
    for (const [, hex, num] of COLORS) add(String(num + 8), num + 8,
      { background: "linear-gradient(#EFE6D2 28%, " + hex + " 28% 72%, #EFE6D2 72%)", color: "#111" });
    add("Keine Kugel (entfernen)", null, {}, "wide");
    $("pickTitle").textContent = b ? "Welche Kugel ist das?" : "Erst eine Kugel im Bild antippen";
  }

  function update() {
    const m = missing();
    const changed = !!item && item.balls.some((b) => b.changed);
    const r2 = item && item.runde === 2;
    const sb = $("saveBtn");
    const dd = doubles();
    sb.disabled = !item || m > 0 || dd.length > 0;
    sb.className = "big " + (r2 && !changed ? "ok" : "primary");
    sb.textContent = !item ? "Passt alles" : m ? m + " Nummer(n) fehlen" :
      dd.length ? "Nummer " + dd.map(nrText).join(", ") + " doppelt – prüfen" :
      !item.balls.length ? "Ohne Kugeln speichern" :
      r2 ? (changed ? "Korrigiert – speichern" : "✓ Stimmt – bestätigen") :
      changed ? "Speichern & weiter" : "Passt alles";
    $("skipBtn").disabled = !item;
    $("discardBtn").disabled = !item;
    $("undoBtn").disabled = !history.length;
    draw();
    renderChips();
  }

  // ---------------- Zaehler ----------------
  function renderStats(s) {
    stand = s;
    const el = $("stats");
    el.innerHTML = "";
    const add = (val, txt, cls) => {
      if (el.childNodes.length) el.appendChild(document.createTextNode("  ·  "));
      const b = document.createElement("b"); b.textContent = val; if (cls) b.className = cls;
      el.append(b, document.createTextNode(" " + txt));
    };
    add(s.runde1, "in Runde 1");
    add(s.fuer_mich2, "zum Kontrollieren");
    add(s.fertig, "fertig", "q");
    if (s.ich) add(s.ich, "von dir");
  }

  // ---------------- Laden / Speichern ----------------
  function zeigeLeer() {
    item = null; selected = -1; history = [];
    ctx.clearRect(0, 0, view.w, view.h);
    $("caption").hidden = true;
    const e = $("empty");
    e.innerHTML = "";
    const h = document.createElement("div"); h.style.fontSize = "22px"; h.style.color = "var(--ink)";
    h.textContent = "Alles erledigt 🎉";
    const p = document.createElement("div");
    p.textContent = stand && stand.runde2 > stand.fuer_mich2
      ? "Die restlichen Bilder aus Runde 2 hast du selbst festgelegt – die kontrolliert jemand anderes."
      : "Gerade gibt es keine Bilder. Sobald am Tisch neue entstehen, erscheinen sie hier von selbst.";
    e.append(h, p);
    e.classList.add("show");
    $("auftrag").textContent = "Warte auf neue Bilder …";
    $("auftrag").className = "box auftrag";
    update();
  }

  async function load(after) {
    if (loading) return;
    loading = true;
    item = null; selected = -1; history = [];
    update();
    try {
      const r = await fetch("/api/next" + (after ? "?after=" + encodeURIComponent(after) : ""), { cache: "no-store" });
      if (r.status === 401) { showLogin(); return; }
      const data = await r.json().catch(() => ({}));
      if (r.status === 404) { if (data.stand) renderStats(data.stand); zeigeLeer(); return; }
      if (!r.ok) { toast(data.error || "Kein Bild", true); return; }
      $("empty").classList.remove("show");
      item = data;
      renderStats(data.stand);
      view.w = data.width; view.h = data.height;
      fit();
      const cap = $("caption");
      cap.innerHTML = "";
      const rd = document.createElement("span");
      rd.className = "runde r" + data.runde;
      rd.textContent = data.runde === 1 ? "Runde 1 · festlegen" : "Runde 2 · kontrollieren";
      const t = document.createElement("span");
      t.textContent = "Bild vom " + data.name.slice(6, 8) + "." + data.name.slice(4, 6) + ". " + data.name.slice(9, 11) + ":" + data.name.slice(11, 13) + " Uhr";
      cap.append(rd, t);
      if (data.runde === 1 && data.model) {
        const k = document.createElement("span"); k.textContent = "Vorschlag vom KI-Chip"; cap.append(k);
      }
      cap.hidden = false;
      const a = $("auftrag");
      a.innerHTML = "";
      if (data.runde === 1) {
        a.className = "box auftrag";
        a.append("Lege alle Kugeln fest: Kugel antippen → Nummer wählen. Fehlt eine, tippe auf die freie Stelle.");
      } else {
        a.className = "box auftrag r2";
        const b = document.createElement("b"); b.textContent = data.von || "jemand";
        a.append("Festgelegt von ", b, ". Stimmen alle Nummern und Kreise? Dann bestätigen – sonst korrigieren.");
      }
      img.src = "/api/bild?name=" + encodeURIComponent(data.name);
      update();
      const dd = doubles();
      if (dd.length) Notify.show("Nummer " + dd.map(nrText).join(", ") + " doppelt", "Bitte prüfen – rot gestrichelt markiert.", "warning");
    } catch (e) { toast("Keine Verbindung", true); }
    finally { loading = false; }
  }
  img.onload = draw;

  $("saveBtn").addEventListener("click", async () => {
    if (!item) return;
    if (!item.balls.length && !confirm("Liegen auf diesem Bild wirklich KEINE Kugeln?")) return;
    const res = await post("speichern", { name: item.name, balls: item.balls });
    if (res) { heute++; load(); }
  });
  $("discardBtn").addEventListener("click", async () => {
    if (!item || !confirm("Bild als unbrauchbar aussortieren (z. B. Arm oder Queue im Bild, verwackelt)?")) return;
    if (await post("speichern", { name: item.name, discard: true })) load();
  });
  $("skipBtn").addEventListener("click", () => { if (item) load(item.name); });
  $("undoBtn").addEventListener("click", () => {
    if (!history.length || !item) return;
    item.balls = JSON.parse(history.pop());
    selected = -1;
    update();
  });

  // ---------------- Antippen ----------------
  function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * view.w / r.width, (e.clientY - r.top) * view.h / r.height];
  }
  canvas.addEventListener("click", (e) => {
    if (!item) return;
    const [x, y] = canvasPoint(e);
    let best = -1, bd = Infinity;
    item.balls.forEach((b, i) => { const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = i; } });
    if (best >= 0 && bd <= item.radius * 1.6) {
      selected = best === selected ? -1 : best;
    } else {
      snapshot();
      item.balls.push({ x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, kind: "solid", color: "", changed: true });
      selected = item.balls.length - 1;
    }
    update();
  });
  zoom.addEventListener("click", (e) => {
    if (!item || selected < 0) return;
    const r = zoom.getBoundingClientRect();
    const dx = ((e.clientX - r.left) * zoom.width / r.width - zoom.width / 2) / ZOOM;
    const dy = ((e.clientY - r.top) * zoom.height / r.height - zoom.height / 2) / ZOOM;
    snapshot();
    const b = item.balls[selected];
    b.x = Math.round((b.x + dx) * 10) / 10;
    b.y = Math.round((b.y + dy) * 10) / 10;
    b.changed = true;
    update();
  });
  // Tastatur: Enter = speichern, Entf = Kugel entfernen, Esc = abwaehlen, Ziffern = Nummer
  let tippen = "", tippenZeit = 0;
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "Enter" && !$("saveBtn").disabled) { e.preventDefault(); $("saveBtn").click(); }
    else if (e.key === "Escape") { selected = -1; update(); }
    else if ((e.key === "Delete" || e.key === "Backspace") && item && selected >= 0) {
      snapshot(); item.balls.splice(selected, 1); selected = -1; update();
    } else if (item && selected >= 0 && (/^[0-9]$/.test(e.key) || e.key.toLowerCase() === "w")) {
      // "w" = Weisse, sonst Zahl; zweistellig (10-15) innerhalb einer Sekunde
      const now = Date.now();
      tippen = e.key.toLowerCase() === "w" ? "0" : (now - tippenZeit < 1000 && tippen === "1" ? "1" + e.key : e.key);
      tippenZeit = now;
      const n = parseInt(tippen, 10);
      if (n >= 0 && n <= 15) {
        snapshot(); setNumber(item.balls[selected], n); update();
        if (doubles().includes(n)) Notify.show("Nummer " + nrText(n) + " ist jetzt zweimal vergeben", "Bitte nochmal prüfen.", "warning");
      }
    }
  });

  // Ruhig nachschauen, ob neue Bilder da sind
  async function poll() {
    try {
      if (!item && me) {
        const r = await fetch("/api/stand", { cache: "no-store" });
        if (r.status === 401) { showLogin(); return; }
        if (r.ok) {
          const s = await r.json();
          renderStats(s);
          if (s.runde1 || s.fuer_mich2) load();
        }
      }
    } catch (e) { /* naechster Versuch */ }
    setTimeout(poll, 15000);
  }

  let started = false;
  function start(name) {
    me = name;
    $("who").textContent = name;
    $("logoutBtn").hidden = false;
    if (started) { load(); return; }
    started = true;
    load();
    setTimeout(poll, 15000);
  }

  // Beim Verlassen das offene Bild freigeben, damit es jemand anderes bekommt
  window.addEventListener("pagehide", () => {
    try { navigator.sendBeacon("/api/freigeben", new Blob(["{}"], { type: "application/json" })); } catch (e) { /* egal */ }
  });

  fit();
  update();
  fetch("/api/me", { cache: "no-store" }).then((r) => r.json()).then((d) => {
    if (d.name) start(d.name); else showLogin();
  }).catch(() => showLogin("Keine Verbindung"));
})();
</script>
</body>
</html>
