; Gyroskop im Billard-Queue: ESP32 + MPU6050, sendet die Lage per WLAN (UDP) an den Pi.
;
;   pio run -e esp32dev -t upload          normales ESP32-Board (SDA 21, SCL 22)
;   pio run -e xiao_esp32c3 -t upload      Seeed XIAO ESP32-C3 (klein, passt ins Queue-Ende; SDA D4, SCL D5)
;   pio run -e m5stack-atom -t upload      M5Stack Atom Lite / Atom Matrix (Grove: SDA G26, SCL G32)
;   pio run -e m5stack-atoms3 -t upload    M5Stack AtomS3 / AtomS3 Lite (Grove: SDA G2, SCL G1)
;   pio device monitor                     Ausgaben ansehen (115200 Baud)
;
; WLAN-Name/Passwort vorher in include/config.h eintragen.

[env]
framework = arduino
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -DSDA_PIN=21 -DSCL_PIN=22

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
build_flags = -DSDA_PIN=6 -DSCL_PIN=7 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; M5Stack Atom Lite / Atom Matrix: Gyro-Accelerometer (MPU6050/GY-521) am Grove-Port.
; Ohne Sensor am Grove-Port nimmt der Atom Matrix seinen eingebauten MPU6886 (SDA G25, SCL G21).
[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
upload_speed = 115200
build_flags = -DSDA_PIN=26 -DSCL_PIN=32 -DALT_SDA_PIN=25 -DALT_SCL_PIN=21

; M5Stack AtomS3 / AtomS3 Lite: Grove-Port, sonst der eingebaute IMU des AtomS3 (SDA G38, SCL G39).
[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
build_flags = -DSDA_PIN=2 -DSCL_PIN=1 -DALT_SDA_PIN=38 -DALT_SCL_PIN=39 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
