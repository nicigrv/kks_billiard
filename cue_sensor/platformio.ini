; Gyroskop im Billard-Queue: ESP32 + MPU6050, sendet die Lage per WLAN (UDP) an den Pi,
; sobald der Pi sie abonniert hat. M5Stack Atom: LED zeigt Verbindung/Team, Knopf startet ein Spiel.
;
;   pio run -e esp32dev -t upload          normales ESP32-Board (SDA 21, SCL 22)
;   pio run -e xiao_esp32c3 -t upload      Seeed XIAO ESP32-C3 (klein, passt ins Queue-Ende; SDA D4, SCL D5)
;   pio run -e m5stack-atom -t upload      M5Stack Atom Lite / Atom Matrix (Grove: SDA G26, SCL G32)
;   pio run -e m5stack-atoms3 -t upload    M5Stack AtomS3 / AtomS3 Lite (Grove: SDA G2, SCL G1)
;   pio device monitor                     Ausgaben ansehen (115200 Baud)
;
; Ohne USB-Kabel (Queue zusammengebaut, im WLAN): Firmware ueber das Netz aufspielen
;   - Admin-Panel des Pi -> Queue -> "Firmware aktualisieren" (holt die neueste Version von GitHub)
;   - Browser: http://<queue-ip>/update, Datei .pio/build/<board>/firmware.bin hochladen
;   - PlatformIO:  QUEUE_IP=192.168.88.60 QUEUE_CASTCODE=K7P2QM pio run -e m5stack-atom-ota -t upload
;     (Windows PowerShell: $env:QUEUE_IP="192.168.88.60"; $env:QUEUE_CASTCODE="K7P2QM"; pio run -e m5stack-atom-ota -t upload)
;
; WLAN wird nicht hier eingetragen, sondern beim ersten Start ueber den Hotspot "Billard-Queue-...".

[platformio]
default_envs = esp32dev, xiao_esp32c3, m5stack-atom, m5stack-atoms3

[env]
framework = arduino
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -DSDA_PIN=21 -DSCL_PIN=22 -DBOARD_ENV='"esp32dev"'

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
build_flags = -DSDA_PIN=6 -DSCL_PIN=7 -DBOARD_ENV='"xiao_esp32c3"' -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; M5Stack Atom Lite / Atom Matrix: Gyro-Accelerometer (MPU6050/GY-521) am Grove-Port.
; Ohne Sensor am Grove-Port nimmt der Atom Matrix seinen eingebauten MPU6886 (SDA G25, SCL G21).
; LED G27 (Atom Matrix: 25 LEDs, alle leuchten), Knopf G39.
[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
upload_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
build_flags = -DSDA_PIN=26 -DSCL_PIN=32 -DBOARD_ENV='"m5stack-atom"' -DALT_SDA_PIN=25 -DALT_SCL_PIN=21
  -DLED_PIN=27 -DLED_COUNT=25 -DLED_BRIGHTNESS=30 -DBTN_PIN=39

; M5Stack AtomS3 / AtomS3 Lite: Grove-Port, sonst der eingebaute IMU des AtomS3 (SDA G38, SCL G39).
; AtomS3 Lite: LED G35, Knopf G41 (der AtomS3 mit Display hat keine LED, der Knopf geht trotzdem).
[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
build_flags = -DSDA_PIN=2 -DSCL_PIN=1 -DBOARD_ENV='"m5stack-atoms3"' -DALT_SDA_PIN=38 -DALT_SCL_PIN=39 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
  -DLED_PIN=35 -DLED_COUNT=1 -DLED_BRIGHTNESS=60 -DBTN_PIN=41

; ---- Firmware ueber das WLAN aufspielen (ArduinoOTA, Port 3232). Passwort = Castcode des Queues.
[ota]
upload_protocol = espota
upload_port = ${sysenv.QUEUE_IP}
upload_flags = --auth=${sysenv.QUEUE_CASTCODE}

[env:esp32dev-ota]
extends = env:esp32dev, ota

[env:xiao_esp32c3-ota]
extends = env:xiao_esp32c3, ota

[env:m5stack-atom-ota]
extends = env:m5stack-atom, ota

[env:m5stack-atoms3-ota]
extends = env:m5stack-atoms3, ota
